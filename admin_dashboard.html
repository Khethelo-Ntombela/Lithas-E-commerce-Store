<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Khethelo's Store</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .admin-container { background: white; padding: 20px; border-radius: 8px; max-width: 1000px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #004751; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .add-btn { background: #72d54e; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<header>
    <h2>Product Management (Admin)</h2>
    <div>
        <a href="upload.html" class="add-btn">+ Post New Ad</a>
        <a href="logout.php" style="color: red; margin-left: 20px; text-decoration: none; font-weight: bold;">Logout</a>
    </div>
</header>
<body>

<div class="admin-container">
    <header>
        <h2>Product Management (Admin)</h2>
        <a href="upload.html" class="add-btn">+ Post New Ad</a>
    </header>

    <table id="admin-table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="admin-list">
            </tbody>
    </table>
</div>

<script>
    async function loadAdminProducts() {
        const response = await fetch('get_products.php');
        const products = await response.json();
        const list = document.getElementById('admin-list');
        list.innerHTML = "";

        products.forEach(p => {
            list.innerHTML += `
                <tr>
                    <td><img src="uploads/${p.img1}" width="50"></td>
                    <td>${p.product_name}</td>
                    <td>R ${parseFloat(p.product_price).toLocaleString()}</td>
                    <td>
                        <button class="del-btn" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    async function deleteProduct(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            const response = await fetch(`delete_product.php?id=${id}`);
            const result = await response.text();
            alert(result);
            loadAdminProducts(); // Refresh the list
        }
    }

    window.onload = loadAdminProducts;
</script>

</body>
</html>
