<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details - Litha's FarmBook</title>
    <style>
       body { font-family: sans-serif; background: #eee; padding: 20px; }

        /* Main Container */
        .product-page { 
            display: flex; 
            background: white; 
            padding: 20px; 
            max-width: 900px; 
            margin: auto; 
            border: 1px solid #ccc; 
        }

        /* Gallery - Thumbs on left, big image next to it */
        .gallery-section { display: flex; gap: 10px; }

        .thumbnails { display: flex; flex-direction: column; gap: 5px; }

        .thumbnails img, .thumbnails video { 
            width: 60px; 
            height: 60px; 
            border: 1px solid #999; 
            cursor: pointer; 
        }

        .main-viewer img, .main-viewer video { 
            width: 400px; 
            height: 400px; 
            border: 1px solid #ccc; 
            object-fit: contain; 
        }

        /* Info - Text on the right */
        .info-section { padding-left: 20px; width: 100%; box-sizing: border-box; }

        .price { 
            font-size: 25px; 
            font-weight: bold; 
            color: green; 
            margin: 10px 0; 
        }

      
        .qty-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 15px 0;
        }
        .qty-btn {
            background: #004751;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        .qty-input {
            width: 50px;
            text-align: center;
            padding: 6px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-buy { 
            background: blue; 
            color: white; 
            padding: 12px 20px; 
            border: none; 
            width: 100%; 
            cursor: pointer; 
            display: inline-block;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-buy:hover { background: #0000cd; }

        .description { 
            margin-top: 20px; 
            border-top: 1px solid #ddd; 
        }
    </style>
</head>
<body>

<div class="product-page" id="page-content">
    <div class="gallery-section">
        <div class="thumbnails" id="thumb-list"></div>
        <div class="main-viewer" id="viewer-display"></div>
    </div>

    <div class="info-section">
        <div style="margin-bottom: 10px;">
            <a href="shop.html" style="text-decoration: none; color: #004751; font-weight: bold;">← Back to Shop</a>
        </div>
        <div class="brand">Khethelo's Store</div>
        <h1 id="p-name">Loading...</h1>
        <div id="p-size" style="color:#777; margin-bottom: 10px;"></div>
        
        <div class="stock-tag">In Stock</div>
        <div class="price" id="p-price">R 0.00</div>
        
        <div class="qty-selector">
            <label style="font-weight: bold; margin-right: 10px;">Quantity:</label>
            <button class="qty-btn" onclick="adjustQuantity(-1)">-</button>
            <input type="number" class="qty-input" id="quantity_counter" value="1" min="1" readonly>
            <button class="qty-btn" onclick="adjustQuantity(1)">+</button>
        </div>
        
        <a href="#" class="btn-buy" id="cart-action-link">Add to Cart</a>
        
        <div class="description">
            <h3>Product Information</h3>
            <p id="p-info"></p>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    let dynamicId = 0;

    function adjustQuantity(amount) {
        const counter = document.getElementById('quantity_counter');
        let currentVal = parseInt(counter.value) + amount;
        
        if (currentVal >= 1) {
            counter.value = currentVal;
            // Update the link instantly with the new value
            document.getElementById('cart-action-link').href = `http://lithas-store.infinityfreeapp.com/add_to_cart.php?id=${dynamicId}&qty=${currentVal}`;
        }
    }

    async function loadDetails() {
        try {
            // Absolute path processing for cloud safety
            const response = await fetch(`http://lithas-store.infinityfreeapp.com/get_single_product.php?id=${productId}`);
            const p = await response.json();
            
            dynamicId = p.id;

            // Fill Text layout metrics
            document.getElementById('p-name').innerText = p.product_name;
            document.getElementById('p-size').innerText = `Weight: ${p.product_size}`; // Adjusted label to Weight
            document.getElementById('p-price').innerText = `R ${parseFloat(p.product_price).toLocaleString()}`;
            document.getElementById('p-info').innerText = p.product_info;

            // Initial link configuration on runtime load
            document.getElementById('cart-action-link').href = `http://lithas-store.infinityfreeapp.com/add_to_cart.php?id=${p.id}&qty=1`;

            // Handle Gallery layout setups
            const thumbList = document.getElementById('thumb-list');
            const viewer = document.getElementById('viewer-display');

            // Default view (Image 1)
            viewer.innerHTML = `<img src="uploads/${p.img1}" id="main-content">`;

            // List of all media columns
            const mediaItems = [
                { type: 'img', src: p.img1 },
                { type: 'img', src: p.img2 },
                { type: 'img', src: p.img3 },
                { type: 'video', src: p.video }
            ];

            mediaItems.forEach(item => {
                if (item.src && item.src !== "NULL" && item.src !== "") {
                    let thumb;
                    if (item.type === 'img' || !item.src.endsWith('.mp4')) {
                        thumb = document.createElement('img');
                        thumb.src = `uploads/${item.src}`;
                        thumb.onclick = () => {
                            viewer.innerHTML = `<img src="uploads/${item.src}">`;
                        };
                    } else {
                        thumb = document.createElement('video');
                        thumb.src = `uploads/${item.src}`;
                        thumb.onclick = () => {
                            viewer.innerHTML = `<video src="uploads/${item.src}" controls autoplay style="width:100%"></video>`;
                        };
                    }
                    thumbList.appendChild(thumb);
                }
            });

        } catch (error) {
            console.error("Error loading product details:", error);
        }
    }

    if(productId) {
        loadDetails();
    } else {
        document.body.innerHTML = "<h1>Product not found.</h1>";
    }
</script>

</body>
</html>
