<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litha's Store - Register</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; }
        
        /* Adjusted container height slightly to 520px to perfectly accommodate the new field */
        .main-container {
            display: flex;
            width: 750px;
            height: 520px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Left Side Panel */
        .left-panel {
            flex: 1;
            background: linear-gradient(#6c3483 0%, #a569bd 100%); 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }
        .left-panel h1 { font-size: 1.8em; margin-bottom: 12px; }
        .left-panel p { font-size: 0.9em; opacity: 0.8; line-height: 1.4; }

        /* Right Side Panel */
        .right-panel {
            flex: 1.3;
            padding: 25px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-panel h2 { color: #333; font-size: 1.6em; margin-bottom: 12px; }
        
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; color: #555; margin-bottom: 30px; font-weight: 600; font-size: 0.85em; margin-bottom: 3px; }
        
        .input-group input {
            width: 100%;
            padding: 7px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: #6c3483; outline: none; }

        /* Flex row for side-by-side inputs */
        .input-row {
            display: flex;
            gap: 12px;
        }
        .input-row .input-group {
            flex: 1;
        }

        .btn-register {
            width: 100%;
            padding: 10px;
            background-color: #6c3483; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s;
        }
        .btn-register:hover { background-color: #512e5f; }
        
        .login-link { text-align: center; margin-top: 10px; color: #777; font-size: 0.85em; }
        .login-link a { color: #6c3483; text-decoration: none; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <h1>Welcome!</h1>
        <p>Register and get started with your Ecommerce journey with Litha's Store, your complete shopping solution.</p>
    </div>

    <div class="right-panel">
        <h2>Register</h2>
        <form action="submit.php" method="POST">
            <div class="input-row">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="John">
                </div>
                <div class="input-group">
                    <label>Surname</label>
                    <input type="text" name="surname" required placeholder="Doe">
                </div>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="johndoe123">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="john@example.co.za">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>
                <div class="input-group">
                    <label>ID Number (SA ID)</label>
                    <input type="text" name="id_number" maxlength="13" minlength="13" placeholder="13-digit ID" required>
                </div>
            </div>
            
            <button type="submit" class="btn-register">Register</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
</div>

</body>
</html>
