<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litha's FarmBook - Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif; /* Applied your linked Poppins font */
        }

        body{
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container{
            width: 850px;
            height: 450px;
            background-color: white;
            display: flex;
            border-radius: 15px;
            overflow: hidden; /*This cuts off the sharp green corners on the left side! */
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); /* Soft shadow to make it lift neatly */
        }

        .left-panel{
            width: 40%;
            background-color: #1e8449;
            color: white;
            text-align: center;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centers text vertically inside the green block */
            align-items: center;
        }

        .left-panel h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .left-panel p {
            font-size: 14px;
            opacity: 0.9;
        }

        .right-panel{
            width: 60%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group{
            margin-bottom: 20px;
        }

        .input-group label{
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        .input-group input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        
        .input-group input:focus {
            border-color: #1e8449;
        }

        .btn-login{
            width: 100%;
            padding: 14px;
            background-color: #1e8449;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .btn-login:hover {
            background-color: #196f3d;
        }

        /* Bottom links wrapper layout grid */
        .links-container {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        .links-container a {
            color: #1e8449;
            text-decoration: none;
            font-weight: bold;
        }

        /* Display block breaks this onto its own distinct separate line underneath */
        .forgot-link {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #777 !important;
            font-weight: normal !important;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <h1>Welcome Back!</h1>
        <p>Log in to access your Store records.</p>
    </div>
    <div class="right-panel">
        <h2>Login</h2>
        <form action="login_process.php" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        
        <div class="links-container">
            <div>Don't have an account? <a href="index1.html">Register</a></div>
            <a href="reset_password.html" class="forgot-link">Forgot Password?</a>
        </div>
    </div>
</div>

</body>
</html>
