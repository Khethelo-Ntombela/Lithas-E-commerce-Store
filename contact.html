<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litha's Store - Contact Us</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; }
        
        /* Reduced global proportions for a much tighter look */
        .main-container {
            display: flex;
            width: 750px;
            height: 480px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Left Side Panel - Scaled down text sizing */
        .left-panel {
            flex: 1;
            background: linear-gradient(#0076bd 0%, #00568a 100%); 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }
        .left-panel h1 { font-size: 1.8em; margin-bottom: 12px; }
        .left-panel p { font-size: 0.9em; opacity: 0.8; line-height: 1.4; }

        /* Right Side Panel - Optimized padding gaps */
        .right-panel {
            flex: 1.2;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-panel h2 { color: #333; font-size: 1.6em; margin-bottom: 15px; }
        
        /* Consolidated structural spacing gaps */
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; color: #555; margin-bottom: 4px; font-weight: 600; font-size: 0.85em; }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { 
            border-color: #0076bd; 
            outline: none; 
        }
        
        /* Shorter input height box */
        .input-group textarea {
            height: 75px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #0076bd; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        .btn-submit:hover { background-color: #00568a; }
        
        .store-link { text-align: center; margin-top: 12px; color: #777; font-size: 0.85em; }
        .store-link a { color: #0076bd; text-decoration: none; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <div class="left-panel">
        <h1>Help Desk</h1>
        <p>Have an inquiry or need account modifications? Submit a customer service request to our administration desk.</p>
    </div>

    <div class="right-panel">
        <h2>Contact Us</h2>
        <form action="process_contact.php" method="POST">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="John Doe">
            </div>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="john@example.co.za">
            </div>
            
            <div class="input-group">
                <label>Nature of Inquiry</label>
                <select name="issue_type" required style="background: white;">
                    <option value="">-- Choose Category --</option>
                    <option value="Account Changes Confirmation">Confirm Changes to My Account</option>
                    <option value="Marketplace Escrow and Orders">Marketplace Order Issue</option>
                    <option value="Vendor Balance Inquiry">Vendor Balance / Payout Query</option>
                    <option value="General Assistance">General Assistance</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Message Details</label>
                <textarea name="message" required placeholder="Explain what changes or trace logs you need processed..."></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
        
        <div class="store-link">
            Change your mind? <a href="shop.html">Return to Store</a>
        </div>
    </div>
</div>

</body>
</html>
